global:
  scrape_interval: 5s
  scrape_timeout: 3s

scrape_configs:
  - job_name: retry-lab
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files: [/etc/prometheus/targets.json]
        refresh_interval: 5s
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ['rabbitmq:15692']
