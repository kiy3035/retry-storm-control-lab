services:
  rabbitmq:
    volumes:
      - ./monitoring/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${PROMETHEUS_TARGETS_FILE:-./monitoring/targets.json}:/etc/prometheus/targets.json:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=256MB
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  k6:
    image: grafana/k6:1.2.3
    profiles: [load]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      K6_NO_USAGE_REPORT: "true"
      BASE_URL: ${LOAD_BASE_URL:-http://host.docker.internal:8080}
      ITERATIONS: ${LOAD_ITERATIONS:-12}
      VUS: ${LOAD_VUS:-2}
      MAX_DURATION: ${LOAD_MAX_DURATION:-2m}
      POLL_TIMEOUT_MS: ${LOAD_POLL_TIMEOUT_MS:-30000}
    volumes:
      - ./load:/scripts:ro
      - ${LOAD_RESULTS_DIR:-./build/load-results}:/results
    command: ["run", "/scripts/messages.js"]

volumes:
  prometheus-data:
